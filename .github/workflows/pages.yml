name: pages
on:
  push:
    branches: [main]
    paths: [site/**, web/style.css, web/assets/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          cp web/style.css _site/
          mkdir -p _site/assets
          cp -r web/assets/. _site/assets/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
