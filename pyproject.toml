[project]
name = "sombra"
version = "0.1.0"
description = "Sombra — calor de superfície × vulnerabilidade para priorizar arborização e proteção"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "rasterio>=1.3",
    "duckdb>=1.0",
]

[project.optional-dependencies]
ingest = [
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",
    "rioxarray>=0.15",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.17.4"]

[project.scripts]
sombra = "sombra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sombra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
